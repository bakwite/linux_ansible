#部署若依后端
- name: Create /code directory
  file:
    path: /code
    state: directory
    mode: '0755'

- name: Install ruoyi
  unarchive:
    src: RuoYi-Vue.tar.gz
    dest: /code
    remote_src: no

- name: Copy app directory 
  unarchive:
    src: app.tar.gz
    dest: /
    remote_src: no

- name: Install maven server
  unarchive:
    src: maven.tar.gz
    dest: /app/tools
    owner: root
    group: root
    mode: '0755'
    remote_src: no
    creates: /app/tools/maven/bin/mvn

- name: Add Maven to PATH in /etc/profile
  lineinfile:
    path: /etc/profile
    line: 'export PATH=/app/tools/maven/bin/:$PATH'
    insertafter: EOF
    state: present

- name: Source /etc/profile (reload environment)
  shell: source /etc/profile
  args:
    executable: /bin/bash
  changed_when: false
