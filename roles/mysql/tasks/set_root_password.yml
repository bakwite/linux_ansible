- name: Check root password
  shell: mysql -uroot -p'{{ mysql_root_password }}' -h127.0.0.1 -e "SELECT 1"
  register: root_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Set root password on first run
  shell: |
    mysql -uroot <<'SQL'
    CREATE USER IF NOT EXISTS 'root'@'localhost' IDENTIFIED BY '{{ mysql_root_password }}';
    ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mysql_root_password }}';
    CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY '{{ mysql_root_password }}';
    ALTER USER 'root'@'127.0.0.1' IDENTIFIED BY '{{ mysql_root_password }}';
    GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
    CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY '{{ mysql_root_password }}';
    ALTER USER 'root'@'%' IDENTIFIED BY '{{ mysql_root_password }}';
    GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;
    SQL
  when: root_check.rc != 0
  no_log: true

- name: Create root client config
  copy:
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: '0600'
    content: |
      [client]
      user=root
      password={{ mysql_root_password }}
  no_log: true

- name: Ensure application database user exists
  shell: |
    mysql -uroot -p'{{ mysql_root_password }}' -h127.0.0.1 <<'SQL'
    CREATE USER IF NOT EXISTS '{{ mysql_repl_user }}'@'%' IDENTIFIED BY '{{ mysql_repl_password }}';
    ALTER USER '{{ mysql_repl_user }}'@'%' IDENTIFIED BY '{{ mysql_repl_password }}';
    GRANT ALL PRIVILEGES ON *.* TO '{{ mysql_repl_user }}'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;
    SQL
  changed_when: false
  no_log: true
